name: Gerar arquivo de ativacao Unity

on:
  workflow_dispatch:

jobs:
  activation:
    name: Gerar Unity .alf
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar arquivo de ativacao
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.24f1

      - name: Disponibilizar arquivo .alf
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 7
