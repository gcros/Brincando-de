                  LinearLayout.LayoutParams ds1=new LinearLayout.LayoutParams(0,dp(48),1); ds1.rightMargin=dp(4);
                  LinearLayout.LayoutParams ds2=new LinearLayout.LayoutParams(0,dp(48),1); ds2.leftMargin=dp(4); ds2.rightMargin=dp(4);
                  LinearLayout.LayoutParams ds3=new LinearLayout.LayoutParams(0,dp(48),1); ds3.leftMargin=dp(4);
                  drow2.addView(dsafe,ds1); drow2.addView(darmed,ds2); drow2.addView(dbypass,ds3);
